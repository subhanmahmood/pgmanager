services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No `ports:` block on purpose — Postgres stays on the internal network.
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgmanager:
    # Pinned to the minor float so `docker compose pull` gets patch releases
    # but never crosses a breaking change. Bump manually for major upgrades.
    image: ghcr.io/subhanmahmood/pgmanager:v0.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DATABASE: postgres
      POSTGRES_SSLMODE: disable          # internal network only
      # What clients see in `db create` / `db info` connection strings.
      # Defaults to PGMANAGER_API_DOMAIN — i.e. the same hostname Caddy
      # serves the API on. Override POSTGRES_PUBLIC_HOST in .env if
      # Postgres lives on a different DNS name than the API.
      POSTGRES_PUBLIC_HOST: ${POSTGRES_PUBLIC_HOST:-${PGMANAGER_API_DOMAIN}}
      POSTGRES_PUBLIC_PORT: ${POSTGRES_PUBLIC_PORT:-5432}
      PGMANAGER_LISTEN: 0.0.0.0:8080
      PGMANAGER_REQUIRE_TOKEN: "true"
      PGMANAGER_ENCRYPTION_KEY: ${PGMANAGER_ENCRYPTION_KEY:?run `pgmanager keygen` and set PGMANAGER_ENCRYPTION_KEY}
      PGMANAGER_DATA_DIR: /var/lib/pgmanager
      # Local admin socket. Anything that can open it is admin, so it stays
      # inside the container — `docker compose exec` is the way in. This is
      # what makes the bootstrap token disposable.
      PGMANAGER_SOCKET: /run/pgmanager/pgmanager.sock
      # Uncomment to pre-seed the admin token instead of letting it auto-generate:
      # PGMANAGER_BOOTSTRAP_TOKEN: ${PGMANAGER_BOOTSTRAP_TOKEN}
      # Per-database backups to S3-compatible object storage. Disabled by
      # default; uncomment and fill in .env to enable. Never dev/staging/prod
      # only — pr databases are never backed up.
      # PGMANAGER_BACKUP_ENABLED: "true"
      # PGMANAGER_BACKUP_ENDPOINT: ${PGMANAGER_BACKUP_ENDPOINT}
      # PGMANAGER_BACKUP_REGION: ${PGMANAGER_BACKUP_REGION}
      # PGMANAGER_BACKUP_BUCKET: ${PGMANAGER_BACKUP_BUCKET}
      # PGMANAGER_BACKUP_PREFIX: ${PGMANAGER_BACKUP_PREFIX}
      # PGMANAGER_BACKUP_ACCESS_KEY_ID: ${PGMANAGER_BACKUP_ACCESS_KEY_ID}
      # PGMANAGER_BACKUP_SECRET_ACCESS_KEY: ${PGMANAGER_BACKUP_SECRET_ACCESS_KEY}
      # PGMANAGER_BACKUP_SCHEDULE: 24h
      # PGMANAGER_BACKUP_RETENTION: "7"
    volumes:
      - pgmanager-data:/var/lib/pgmanager
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [pgmanager]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Serves both the API and the admin UI. Must resolve to this host before
      # `docker compose up` — Caddy provisions the certificate on first request.
      PGMANAGER_API_DOMAIN: ${PGMANAGER_API_DOMAIN:?PGMANAGER_API_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  pgmanager-data:
  caddy-data:
  caddy-config:
